[project]
name = "langchain-app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Steven Liu", email = "steven.weike.liu@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "langchain>=1.4.9",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.7.4",
    "langchain-pinecone>=0.2.13",
    "langchain-tavily>=0.2.18",
    "langchain-text-splitters>=1.1.3",
    "langchain-unstructured>=1.0.1",
    "packaging>=26.3",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "tavily>=1.1.0",
    "unstructured>=0.27.37",
]

[project.scripts]
langchain-app = "langchain_app:main"
agents-under-the-hood = "agents_under_the_hood:main"
medium-analyser = "rag:medium_analyser"
medium-ingestion = "rag:medium_ingestion"
create-new-index = "rag:create_new_index"
document-assistant = "document_assistant:document_assistant"
document-ingestion = "document_assistant:document_ingestion"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
]
